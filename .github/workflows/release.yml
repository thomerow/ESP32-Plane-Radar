# Tag a release (v1.0.0) to attach firmware to GitHub Releases.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, so the firmware version ("git describe")
          # names the last release.
          fetch-depth: 0

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build and merge
        run: |
          pio run -e supermini
          pio run -t merge -e supermini

      - name: Package release files
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          cp .pio/build/supermini/firmware-merged.bin "dist/plane-radar-${VERSION}-full.bin"
          cp .pio/build/supermini/firmware.bin "dist/plane-radar-${VERSION}-ota.bin"
          for image in dist/*.bin; do
            sha256sum "$image" > "${image}.sha256"
          done
          echo "version=${VERSION}" >> "$GITHUB_ENV"

      - name: Release text from the tag message
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # checkout may store the tag without its message; fetch the real one.
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "$(git cat-file -t "${GITHUB_REF_NAME}")" == "tag" ]]; then
            # Annotated tag: its message (subject line, blank line, body) becomes the release text.
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${GITHUB_REF_NAME}" > release-notes.md
          else
            echo "Firmware build ${version}." > release-notes.md
          fi
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          # Appends the "Full Changelog" link below the tag message.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
